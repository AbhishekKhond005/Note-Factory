spring.application.name=NoteFactory
server.port=8080

# ── Postgres (production) ──────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/notefactory
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration

# ── Storage paths ──────────────────────────────────────────────────────────────
notefactory.storage.notes-dir=/home/abhishek/Coding/RESUME PROJECTS/Note-Factory/notes
notefactory.storage.roadmaps-dir=/home/abhishek/Coding/RESUME PROJECTS/Note-Factory/roadmaps

# ── Generation provider (OpenCode CLI) ────────────────────────────────────────
# Each chapter generation runs opencode inside a fresh Docker container to
# bypass per-session rate limits. Set force-docker=true to always use a
# container; otherwise a container is spun up automatically as a fallback when
# the native CLI hits a quota/rate-limit error.
notefactory.provider.model=opencode/big-pickle
notefactory.provider.docker-image=opencode-runner:latest
notefactory.provider.force-docker=true
